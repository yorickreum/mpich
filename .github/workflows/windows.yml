name: windows

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
      - "[0-9]+.[0-9]+.x"
      - "windows-port"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:

    # autotools and shell scripts need LF line endings; .gitattributes has
    # "text=auto", which checks out CRLF on Windows by default
    - name: Use LF line endings
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout required submodules
      shell: bash
      run: git submodule update --init modules/json-c modules/mydef_boot

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          autotools
          make
          patch
          perl
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-python

    - name: Autogen
      run: ./autogen.sh -without-ucx -without-ofi -without-hwloc

    - name: Build and stage
      run: maint/windows/build.sh "$PWD/build" "$PWD/maint/windows/stage"

    - name: Run MPICH tests
      run: |
        export PATH="$PWD/maint/windows/stage/bin:$PATH"
        export MPITEST_RUN_INDIVIDUAL=1 MPITEST_TIMEOUT=120
        mkdir build-test && cd build-test
        ../test/mpi/configure --with-mpi="$PWD/../maint/windows/stage" \
            --disable-fortran --disable-cxx --disable-romio --disable-ft-tests --disable-spawn
        dirs=basic,init,group,pt2pt,comm,coll
        make -C util
        for d in ${dirs//,/ }; do make -j4 -C $d; done
        cp ../test/mpi/coll/coords-*.txt coll/
        ../test/mpi/runtests -srcdir=../test/mpi -tests=testlist -testdirs=$dirs \
            -mpiexec="$PWD/../maint/windows/stage/bin/mpiexec.exe" -junitfile=summary.junit.xml

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build wheel
      shell: pwsh
      run: |
        python -m pip install setuptools wheel
        python -m pip wheel --no-build-isolation --no-deps -w dist maint/windows

    - name: Test wheel with mpi4py
      shell: pwsh
      run: |
        python -m venv venv
        venv\Scripts\python -m pip install (Get-Item dist\*.whl).FullName mpi4py
        $env:PATH = "$PWD\venv\Scripts;$env:SystemRoot\System32;$env:SystemRoot"
        mpiexec -n 4 venv\Scripts\python maint\windows\smoke_test.py
        mpiexec -n 4 venv\Scripts\python maint\windows\mpi4py_test.py

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mpich-windows
        path: |
          dist/*.whl
          build-test/summary.junit.xml
